<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>ScAnRoIdS | Sign in</title><link rel="stylesheet" href="{{ url_for('static',filename='css/style.css') }}"></head>
<body class="login-page"><main class="login-card"><p class="eyebrow">NETWORK SECURITY WORKSPACE</p><h1>ScAnRoIdS<span class="accent">.</span></h1><p class="muted">Sign in to view this training session.</p>
{% if error %}<p role="alert" class="error">{{ error }}</p>{% endif %}
<form method="post"><input type="hidden" name="csrf" value="{{ csrf }}"><label for="username">Username</label><input id="username" name="username" autocomplete="username" value="operator" required><label for="password">Session password</label><input id="password" name="password" type="password" autocomplete="current-password" required><button class="primary" type="submit">Open workspace →</button></form><p class="muted small">Shared results. Scans are controlled from the instructor terminal.</p></main></body></html>
<!-- INPUT: CSRF token and optional login error. OUTPUT: Viewer authentication form. -->
